services:
  - type: web
    name: regalos-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: regalos-db
          property: connectionString

databases:
  - name: regalos-db
    databaseName: regalos
    user: tienda
    plan: free
    postgresMajorVersion: "17"
