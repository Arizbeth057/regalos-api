services:
  postgres:
    image: postgres:17-alpine
    container_name: regalos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: regalos
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d regalos"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    container_name: regalos-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://tienda:${POSTGRES_PASSWORD:?Copia .env.example a .env y define POSTGRES_PASSWORD}@postgres:5432/regalos
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
